[project]
name = "valutatrade-hub"
version = "1.0.0"
description = "Учебный валютный кошелёк Khafizov m26-555"
readme = "README.md"
authors = [{name = "Khafizov"}]
requires-python = ">=3.12"
dependencies = ["prettytable>=3.12,<4", "requests>=2.32,<3"]

[project.scripts]
project = "valutatrade_hub.cli.interface:main"
valutatrade = "valutatrade_hub.cli.interface:main"

[dependency-groups]
dev = ["ruff>=0.17,<0.18"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valutatrade_hub"]

[tool.hatch.build.targets.sdist]
include = ["/valutatrade_hub", "/tests", "/main.py", "/Makefile",
           "/.python-version", "/uv.lock", "/.gitignore"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.valutatrade]
data_dir = "data"
log_dir = "logs"
rates_ttl_seconds = 300
default_base_currency = "USD"
log_format = "json"
log_level = "INFO"
log_max_bytes = 1048576
log_backup_count = 3